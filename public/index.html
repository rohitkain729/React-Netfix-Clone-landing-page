<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../node_modules/react/umd/react.development.js"></script>
    <script src="../node_modules/react-dom/umd/react-dom.development.js"></script>
    <script src="../node_modules/@babel/standalone/babel.js"></script>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />

    <style>
      .bg-image {
        background-image: url("netflix-img.npg.jpg");
        background-size: cover;
        height: 100vh;
      }
      .bg-shade {
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.6);
      }
      .brand-title {
        font-size: 2.8rem;
        font-weight: 600;
        color: red;
        font-family: Arial, Helvetica, sans-serif;
      }
        main{
         margin-top: 100px;
        }
        .main-title{
            font-size: 3rem;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
        .main-subtitle{
            font-size: 1.7rem;
            margin-top: .5rem;
        }
        form{
            margin-left: 400px;
            margin-right: 400px;
            margin-top: 20px;
        }

    </style>

    <script type="text/babel">
      function NetflixHeader() {
        return (
          <header className="d-flex justify-content-between p-4">
            <div>
              <span className="brand-title">NETFLIX</span>
            </div>
            <div>
              <div className="input-group">
                <span className="bi input-group-text bi-translate"></span>
                <select className="form-select">
                  <option>Landuage</option>
                  <option>ENGLISH</option>
                  <option>HINDI</option>
                </select>
                <button className="btn btn-danger ms-2">SignIn</button>
              </div>
            </div>
          </header>
        );
      }

      function NetflixRegister(){

        return (
            <form >
            <p>Ready to watch? Enter your email to create or restart your membership.</p>
            <div className="input-group input-group-lg">
                <input type="email" placeholder="Email Address" className="form-control" />
                <button className="btn btn-danger ms-2">Get Started <span className="bi bi-chevron-right"></span></button>
            </div>    
            </form>
        );

      }

      function NetflixMain() {
        return (
          <main className="text-white text-center">
                <div className="main-title">
                    Unlimited movies, shows, and more 
                time.
                </div>
                <div className="main-subtitle">
                Starts at ₹149. Cancel at any    
                </div>
                <NetflixRegister/>
          </main>
        );
      }


      function NetflixIndex() {
        return (
          <div className="bg-image">
            <div className="bg-shade">
              <NetflixHeader />
              <NetflixMain/>
            </div>
          </div>
        );
      }
      ReactDOM.render(<NetflixIndex />, document.getElementById("root"));
    </script>
  </head>
  <body>
    <noscript>Please enable javascript on your browser</noscript>

    <div id="root"></div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </body>
</html>
